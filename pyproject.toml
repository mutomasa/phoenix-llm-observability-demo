[project]
name = "phoenix-llm-observability-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-client>=3.5.0",
    "arize-phoenix-evals>=3.9.2",
    "arize-phoenix-otel>=0.17.2",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "openai>=3.31.0",
    "openinference-instrumentation-langchain>=0.1.79",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
